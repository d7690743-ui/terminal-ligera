plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nexos.terminal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexos.terminal'
        minSdk 24
        // targetSdk 28 como Termux (2.4): Android 10+ (API 29)
        // bloquea que una app ejecute binarios de su propia
        // carpeta de datos (W^X) cuando targetSdk >= 29. Con 28
        // el bash del bootstrap sí se puede ejecutar directo.
        // compileSdk sigue en 35. No afecta a la instalación
        // por sideload (el piso de Android 14 es targetSdk 23).
        targetSdk 28
        versionCode 12
        versionName '2.10'
    }

    // Firma estable: una sola llave para todos los builds (2.3).
    // Antes cada runner de GitHub generaba su propio debug keystore
    // y cada APK salía con certificado distinto, así que Android
    // no dejaba actualizar sin desinstalar (y al desinstalar se
    // borraba el bootstrap). Esta llave vive en el repo
    // (app/terminal-ligera.keystore, PKCS12, alias androiddebugkey,
    // contraseña "android", como el debug keystore estándar).
    // Es una llave de desarrollo, no de Play Store: quien la tenga
    // puede firmar actualizaciones de esta app, por eso solo se
    // usa para Terminal Ligera.
    signingConfigs {
        release {
            storeFile file("terminal-ligera.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // targetSdk 28 deliberado (como Termux): la app se distribuye
    // por sideload, silenciar el aviso de Play Store en lint release.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

// Sin dependencias externas: solo el framework de Android.
dependencies {
}
